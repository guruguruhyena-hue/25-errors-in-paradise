<script>
/* 25 ERRORS IN PARADISE — evolutionary collage engine v0.4
   25 distinct transitions; interaction leaves persistent visual inheritance. */
(()=>{
'use strict';
const stage=document.getElementById('stage'), windows=[...document.querySelectorAll('.win')];
const layer=document.getElementById('evolution'), flash=document.getElementById('recompileFlash');
const gen=document.getElementById('generation'),mem=document.getElementById('memory'),entropy=document.getElementById('entropy'),fill=document.getElementById('entropyFill');
const pauseBtn=document.getElementById('evoPause'),resetBtn=document.getElementById('evoReset');
const assets=['GR1.png','GR2.png','GR3.png','GR4.png','GR6.png','GR7.png','Gr8.png','OBJ.png','gal1.png','gal2.png','gr9.png','obj2.png','obj3.png','obj4.png','obj5.png','obj6.png'];
const names=['BOOT_FRAGMENT','RGB_SLIP','ECHO_MEMORY','SCANLINE_DRIFT','ASCII_BLOOM','MIRROR_FEVER','DATA_MOUTH','PIXEL_RASH','FACE_SPLIT','POPUP_FEEDBACK','CURSOR_GHOST','BLEED_VECTOR','PASTEL_DECAY','NOISE_SKIN','VOID_STITCH','WINDOW_MELT','NET_LAG_HEART','IMAGE_ROT','SHELL_DUPLICATE','PINK_CONTAMINATION','UI_PARASITE','HOLOGRAM_SNEEZE','SOFT_CRASH','ORBIT_GLITCH','WORLD_RECOMPILE'];
let n=0, generation=1, paused=false, marks=[], links=[], influence=new Float32Array(windows.length), bursts=0;
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(R(0,a.length))],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function local(e){const r=stage.getBoundingClientRect(),s=r.width/1400;return {x:(e.clientX-r.left)/s,y:(e.clientY-r.top)/s}}
function getW(w){return {x:parseFloat(w.style.left)||0,y:parseFloat(w.style.top)||0,w:parseFloat(w.style.width)||200,h:parseFloat(w.style.height)||200}}
function addMark(kind,x,y,life=1){
  const el=document.createElement(kind==='glyph'?'span':'img');
  el.className=kind==='glyph'?'glyph':kind==='echo'?'echo':'scar';
  if(kind==='glyph'){el.textContent=pick(['ERROR','25','\\x00','NOT FOUND','♡','?!','DREAM.EXE',names[n%25],'<>','MEMORY']);el.style.color=pick(['#ff00b1','#09d1e2','#181229','#88c912']);el.style.fontSize=R(11,48)+'px'}
  else{el.src='assets/'+pick(assets);el.style.width=R(50,200)+'px';el.style.height=R(65,205)+'px';el.style.objectFit='contain';el.style.opacity=(kind==='echo'?.22:R(.15,.62))*life;el.style.filter='hue-rotate('+R(-95,95)+'deg) contrast('+R(.9,2)+')'}
  el.style.left=clamp(x,0,1350)+'px';el.style.top=clamp(y,0,840)+'px';el.style.transform='rotate('+R(-40,40)+'deg)';
  layer.appendChild(el); marks.push(el);
  while(marks.length>90){marks.shift().remove()}
}
function touch(w,amount=1){let i=windows.indexOf(w);if(i<0)return;influence[i]=clamp(influence[i]+amount,0,8);let img=w.querySelector('img');if(img){img.style.filter='hue-rotate('+R(-110,110)+'deg) saturate('+R(1,3)+') contrast('+R(.9,2)+')';img.style.transform='scale('+R(.85,1.23)+') rotate('+R(-12,12)+'deg)'}let p=getW(w);addMark(pick(['scar','glyph','echo']),p.x+R(0,p.w),p.y+R(0,p.h));}
function spread(i){if(!windows.length)return;let w=windows[i%windows.length];touch(w,.9);let a=getW(w),cx=a.x+a.w/2,cy=a.y+a.h/2;let nearby=windows.map((v,j)=>{let b=getW(v);return {j,d:Math.hypot(cx-(b.x+b.w/2),cy-(b.y+b.h/2))}}).filter(q=>q.j!==i).sort((a,b)=>a.d-b.d);for(let k=0;k<2;k++){let v=nearby[k];if(v&&v.d<620)touch(windows[v.j],.4)}}
function mutateRule(idx){
  const w=pick(windows),p=getW(w),image=w.querySelector('img');
  switch(idx){
    case 0:addMark('glyph',R(0,1300),R(0,850));break;
    case 1:image.style.filter='drop-shadow(13px 0 #f07) drop-shadow(-13px 0 cyan)';break;
    case 2:for(let i=0;i<4;i++)addMark('echo',p.x+R(-90,90),p.y+R(-80,80));break;
    case 3:for(let i=0;i<6;i++)addMark('glyph',R(0,1300),i*145);break;
    case 4:for(let i=0;i<12;i++)addMark('glyph',R(0,1300),R(0,850));break;
    case 5:image.style.transform='scaleX(-1) rotate('+R(-20,20)+'deg)';break;
    case 6:w.querySelector('.tag').textContent='DATA MOUTH // SPEAK ERROR';break;
    case 7:for(let i=0;i<9;i++)addMark('scar',p.x+R(-110,120),p.y+R(-110,120));break;
    case 8:for(let i=0;i<3;i++)addMark('echo',p.x+R(-250,240),p.y+R(-100,120));break;
    case 9:for(let i=0;i<4;i++)addMark('glyph',R(50,1200),R(90,720));break;
    case 10:spread(Math.floor(R(0,windows.length)));break;
    case 11:image.style.filter='contrast(3) grayscale(1)';break;
    case 12:stage.style.background='linear-gradient('+Math.floor(R(0,360))+'deg,#faf2ff,#b7fff0,#ffd9ec)';break;
    case 13:w.style.animation='jitter 1.2s steps(2,end) 7';break;
    case 14:for(let i=0;i<6;i++)addMark('scar',R(0,1300),R(0,850));break;
    case 15:w.style.borderRadius=R(12,85)+'px';w.style.transform='skew('+R(-12,12)+'deg)';break;
    case 16:w.style.opacity=R(.6,1);image.style.filter='blur('+R(0,3)+'px)';break;
    case 17:image.style.filter='invert(1) hue-rotate(120deg)';break;
    case 18:for(let i=0;i<7;i++)addMark('echo',R(0,1200),R(0,750));break;
    case 19:for(let i=0;i<7;i++)addMark('scar',R(0,1300),R(0,850));break;
    case 20:w.querySelector('.bar').style.background='linear-gradient(90deg,#91ff48,#ff37df)';break;

function recompile(){
  flash.style.opacity='.8';setTimeout(()=>flash.style.opacity='0',290);

  for(let i=0;i<35;i++){addMark(i%3?'glyph':'scar',R(0,1300),R(0,850),.45)}
  for(let i=0;i<windows.length;i++){
    let w=windows[i],p=getW(w);

    w.style.left=clamp(700+Math.cos(angle)*rad-p.w/2,4,1394-p.w)+'px';
    w.style.top=clamp(452+Math.sin(angle)*rad*.66-p.h/2,35,865-p.h)+'px';
    w.style.zIndex=String(200+i);
    w.style.transform='rotate('+R(-8,8)+'deg)';
    w.style.opacity=String(R(.78,1));influence[i]*=.46;
  }
  generation++;gen.textContent=String(generation).padStart(2,'0');
}
function update(){mem.textContent=marks.length;let val=Math.min(100,Math.round((marks.length/90)*100));entropy.textContent=val+'%';fill.style.width=val+'%'}
function tick(){if(paused)return;n++;mutateRule((n-1)%25);update()}
document.getElementById('mutate').addEventListener('click',()=>{tick()});
document.getElementById('spawn').addEventListener('click',()=>{for(let i=0;i<4;i++)addMark('scar',R(0,1280),R(0,790));spread(Math.floor(R(0,windows.length)));update()});
windows.forEach(w=>w.addEventListener('click',()=>{if(paused)return;touch(w,1);update()}));
stage.addEventListener('pointerdown',e=>{if(paused||e.target.closest('#hud')||e.target.closest('.ctrl'))return;let p=local(e);addMark('glyph',p.x,p.y);bursts++;if(bursts%3===0)spread(Math.floor(R(0,windows.length)));update()});
pauseBtn.onclick=e=>{e.stopPropagation();paused=!paused;pauseBtn.textContent=paused?'RESUME LIFE':'PAUSE LIFE'};
resetBtn.onclick=e=>{e.stopPropagation();for(const x of marks)x.remove();marks=[];n=0;generation=1;bursts=0;influence.fill(0);gen.textContent='01';stage.style.background='';windows.forEach(w=>{w.style.transform='';w.style.opacity='1';w.style.borderRadius='';w.querySelector('img').style.filter='';w.querySelector('img').style.transform=''});update()};
