const layouts=[[45,143,260,360],[1090,86,264,326],[1003,485,246,275],[164,485,191,341],[932,215,188,364],[344,570,285,214],[15,550,185,245],[630,85,210,295],[891,651,197,172],[301,115,197,263],[1060,682,240,170],[1185,375,152,182],[615,627,228,208],[1121,0,250,175],[452,34,165,194],[720,404,227,216]];
const r=(a,b)=>a+Math.random()*(b-a);let cycle=0,z=100;function fit(){let s=Math.min(innerWidth/1400,innerHeight/900);S.style.transform='translate('+((innerWidth-1400*s)/2)+'px,'+((innerHeight-900*s)/2)+'px) scale('+s+')'}onresize=fit;fit();
function pos(e){let b=S.getBoundingClientRect(),s=b.width/1400;return[(e.clientX-b.left)/s,(e.clientY-b.top)/s]}
function errorBurst(x,y){for(let i=0;i<6;i++){let q=document.createElement('img');q.className='virus';q.src='assets/'+files[Math.floor(r(0,files.length))];q.style.cssText+=';left:'+(x+r(-70,70))+'px;top:'+(y+r(-70,70))+'px;width:'+r(30,130)+'px;height:'+r(40,150)+'px;z-index:5000';E.append(q);setTimeout(()=>q.remove(),3100)}}

d.querySelector('.bar').onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;d.style.zIndex=++z;let [sx,sy]=pos(e),x0=parseFloat(d.style.left),y0=parseFloat(d.style.top);d.setPointerCapture(e.pointerId);d.onpointermove=ev=>{let [px,py]=pos(ev);d.style.left=Math.max(0,Math.min(1400-w,x0+px-sx))+'px';d.style.top=Math.max(0,Math.min(870-h,y0+py-sy))+'px'};d.onpointerup=()=>{d.onpointermove=null;d.onpointerup=null}};
});
for(let i=0;i<95;i++){let e=document.createElement('b');e.className='stamp';e.textContent=['25','ERROR','♡','✳','NULL','404','EXE','☆','0x25','♡'][i%10];e.style.cssText='left:'+r(0,1390)+'px;top:'+r(0,890)+'px;font-size:'+r(13,76)+'px;color:'+['#fa11a1','#72f000','#00b2dd','#a587ff'][i%4]+';opacity:'+r(.15,.52)+';transform:rotate('+r(-40,40)+'deg)';E.append(e)}

S.addEventListener('click',e=>{if(e.target.closest('#hud')||e.target.closest('.ctrl'))return;let [x,y]=pos(e);errorBurst(x,y)});crawl.textContent=(errors.join(' ✳ ')+' 25 ERRORS IN PARADISE // ').repeat(6);setInterval(mutate,25000);
</script></body></html>
