  if(current&&current!==lastSrc){lastSrc=current;try{window.__hydraInfectionSource=lastSrc; /* Image changes are rare; source follows the hero. */}catch(e){}}
  let state=stage.classList.contains('frozen')?'FREEZE':stage.classList.contains('converging')?'CONVERGE':'SCATTER';
  if(state!==phase){phase=state; if(state==='CONVERGE'){intensity=.90;} else if(state==='FREEZE'){intensity=.02;} else{intensity=.35;} update();}
},150);
const group=document.getElementById('windows');
group.addEventListener('click',e=>{if(!available||!e.target.closest('.heart-btn')&&!e.target.closest('[data-action="breed"]'))return;intensity=clamp(intensity+.12,0,1);update()});
/* WebGL canvas data is often missed by html2canvas. During S capture,
   replace it with a raster image, allow original key handler to capture,
   then restore the live canvas. */
document.addEventListener('keydown',e=>{
 if(e.key.toLowerCase()!=='s'||e.repeat||!available||!enabled)return;
 try{
 const img=document.createElement('img');img.src=canvas.toDataURL('image/png');img.id='hydra-screenshot-image';
 img.style.cssText='position:absolute;left:250px;top:45px;width:900px;height:790px;z-index:97;pointer-events:none;opacity:'+getComputedStyle(canvas).opacity+';mix-blend-mode:screen';
 canvas.after(img);canvas.style.visibility='hidden';setTimeout(()=>{img.remove();canvas.style.visibility=''},1600);
 }catch(err){console.warn('Hydra screenshot fallback:',err)}
},true);
})();
</script>
